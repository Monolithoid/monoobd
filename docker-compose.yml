version: "3.8"

# ============================================================
# STACK MonooBD — monoobd.${DOMAIN}
# ============================================================
#
# Publicly exposed:
#   monoobd.${DOMAIN}   → Web app (upload + side-by-side preview)
#
# Internal service:
#   inference           → HuggingFace Diffusers microserver (port 8000, CPU)
#
# Persistent volumes under /opt/ia/bd/ (survive restarts):
#   models/     → HuggingFace cache (SD 1.5 + ControlNet, ~5 GB, downloaded once)
#   outputs/    → generated images (history)
#   sessions/   → webapp sessions (no re-login after a restart)
#   projects/   → comic projects (JSON, owned by the node user)
#   renders/    → generated images: original.png + result.png per render (archive)
#
# Variables to set in Coolify → Environment Variables:
#   DOMAIN               : monolithoid.com
#   DOCKERHUB_USERNAME   : your Docker Hub username
#   OAUTH_CLIENT_ID      : Google Cloud Console → OAuth 2.0 → Client ID
#   OAUTH_CLIENT_SECRET  : same → Client Secret
#   SESSION_SECRET       : openssl rand -hex 32
#   ALLOWED_EMAIL        : your allowed Gmail address
#   OPENAI_API_KEY       : (optional) enables the ChatGPT / OpenAI engine
#   NOVELAI_API_KEY      : (optional) enables the NovelAI engine (Persistent API Token)
#   DEFAULT_BACKEND      : (optional) local | openai | novelai
#
# Before deploying:
#   sudo bash setup-vps.sh
# ============================================================

services:

  # ----------------------------------------------------------
  # INFERENCE — Diffusers img2img + ControlNet microserver
  # CPU only — slow generations (10-30 min)
  # First start: downloads ~5 GB of models from HuggingFace
  # ----------------------------------------------------------
  inference:
    image: ${DOCKERHUB_USERNAME}/bd-inference:latest
    container_name: bd-inference
    restart: unless-stopped
    volumes:
      - /opt/ia/bd/models:/models
      - /opt/ia/bd/outputs:/outputs
    environment:
      - HF_HOME=/models/hf-cache
      - PRELOAD_MODES=${PRELOAD_MODES:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    mem_limit: 18g
    networks:
      - bd-network

  # ----------------------------------------------------------
  # MONOOBD WEBAPP — upload interface + side-by-side preview
  # Google SSO — access restricted to ${ALLOWED_EMAIL}
  # Exposed through Traefik as monoobd.${DOMAIN}
  # ----------------------------------------------------------
  webapp:
    image: ${DOCKERHUB_USERNAME}/bd-webapp:latest
    container_name: monoobd-webapp
    restart: unless-stopped
    volumes:
      - /opt/ia/bd/sessions:/data/sessions
      - /opt/ia/bd/projects:/data/projects
      - /opt/ia/bd/renders:/data/renders
    environment:
      - INFERENCE_URL=http://inference:8000
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALLOWED_EMAIL=${ALLOWED_EMAIL}
      - DOMAIN=${DOMAIN}
      # API-based AI engines (optional — an engine only appears when its key is set)
      - DEFAULT_BACKEND=${DEFAULT_BACKEND:-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-gpt-image-1}
      - OPENAI_IMAGE_QUALITY=${OPENAI_IMAGE_QUALITY:-medium}
      - NOVELAI_API_KEY=${NOVELAI_API_KEY:-}
      - NOVELAI_MODEL=${NOVELAI_MODEL:-nai-diffusion-4-5-full}
      - NOVELAI_STRENGTH=${NOVELAI_STRENGTH:-}
      - LOCAL_ENABLED=${LOCAL_ENABLED:-true}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monoobd.rule=Host(`monoobd.${DOMAIN}`)"
      - "traefik.http.routers.monoobd.entrypoints=https"
      - "traefik.http.routers.monoobd.tls.certresolver=letsencrypt"
      - "traefik.http.services.monoobd.loadbalancer.server.port=8080"
    depends_on:
      - inference
    networks:
      - bd-network
      - coolify

networks:
  bd-network:
    driver: bridge
  coolify:
    external: true
