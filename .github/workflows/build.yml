name: Build & Push — Images BD

# Publie deux images sur Docker Hub :
#   monolithoid/bd-inference  → Microserveur HuggingFace Diffusers (CPU)
#   monolithoid/bd-webapp     → Interface web + Google SSO
#
# Secrets requis :
#   DOCKERHUB_USERNAME : monolithoid
#   DOCKERHUB_TOKEN    : Docker Hub → Account Settings → Security → New Access Token

on:
  push:
    paths:
      - 'inference/**'
      - 'webapp/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bd-inference
            image: monolithoid/bd-inference
            context: ./inference
            dockerfile: ./inference/Dockerfile
            title: MonooBD inference
            role: microserveur d'inférence (FastAPI + Diffusers, CPU)
            # Docker Hub short description: 100 bytes max (accented characters count double)
            description: "MonooBD — inférence CPU (Diffusers, SD 1.5 + ControlNet) pour encrer et coloriser des BD"

          - name: bd-webapp
            image: monolithoid/bd-webapp
            context: ./webapp
            dockerfile: ./webapp/Dockerfile
            title: MonooBD webapp
            role: interface web (Node.js/Express + Google SSO)
            description: "MonooBD — interface web (Node.js/Express, Google SSO) pour encrer et coloriser des planches BD"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/${{ matrix.context }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.vendor=monolithoid

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          platforms: linux/amd64

      - name: Compose Docker Hub overview
        if: github.ref == 'refs/heads/main'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RAW_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
          IMAGE: ${{ matrix.image }}
          ROLE: ${{ matrix.role }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        shell: bash
        run: |
          # Docker Hub cannot resolve the README's relative paths: images point to the
          # raw file of this commit, other links to the file on GitHub.
          python3 - README.md "$RUNNER_TEMP/dockerhub-README.md" <<'PY'
          import os, re, sys
          src, dst = sys.argv[1], sys.argv[2]
          env = os.environ
          repo, raw, ref = env["REPO_URL"], env["RAW_URL"], env["GITHUB_REF_NAME"]
          context = env["CONTEXT"].removeprefix("./")
          dockerfile = env["DOCKERFILE"].removeprefix("./")
          text = open(src, encoding="utf-8").read()
          def absolute(path):
              path = path[2:] if path.startswith("./") else path
              if re.search(r"\.(png|jpe?g|gif|svg|webp)$", path.split("#")[0], re.I):
                  return f"{raw}/{path}"
              return f"{repo}/blob/{ref}/{path}"
          relative = r"(?!https?://|mailto:|#|/)([^)\"\s]+)"
          text = re.sub(r"(\]\()" + relative, lambda m: m.group(1) + absolute(m.group(2)), text)
          text = re.sub(r"(src=\")" + relative, lambda m: m.group(1) + absolute(m.group(2)), text)
          intro = (
              f"> **`{env['IMAGE']}`** : {env['ROLE']} du projet MonooBD. "
              f"Code source : [{context}]({repo}/tree/{ref}/{context}).\n\n"
          )
          text = intro + text + (
              "\n\n---\n\n## Liens\n\n"
              f"- Code source de cette image : [{context}]({repo}/tree/{ref}/{context})\n"
              f"- Dockerfile : [{dockerfile}]({repo}/blob/{ref}/{dockerfile})\n"
              f"- Déploiement (Compose) : [docker-compose.yml]({repo}/blob/{ref}/docker-compose.yml)\n"
              f"- Projet complet : [{env['GITHUB_REPOSITORY']}]({repo})\n"
              f"- Signaler un problème : [issues GitHub]({repo}/issues)\n"
          )
          open(dst, "w", encoding="utf-8").write(text)
          PY

      - name: Update Docker Hub description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ matrix.image }}
          short-description: ${{ matrix.description }}
          readme-filepath: ${{ runner.temp }}/dockerhub-README.md

      - name: Build summary
        run: |
          echo "## ${{ matrix.name }} publié" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Commande |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`docker pull ${{ matrix.image }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| build  | \`docker pull ${{ matrix.image }}:build-${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
